<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ฝึกภาษาจีนพื้นฐานในชีวิตประจำวัน</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #fff;
      color: #444;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading {
        transition: none;
      }

      .spinner {
        animation-duration: 1.5s;
      }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div>กำลังโหลดบทเรียนภาษาจีน...</div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzrRkTDje_6nnj975J6Z4xv1ai3DZWHJ3GxMIc8sNQC9vcJEOQelXq6MfcTU1iARQgj/exec"
    title="ฝึกภาษาจีนพื้นฐานในชีวิตประจำวัน"
    allow="fullscreen"
    onload="document.getElementById('loading').classList.add('hidden')">
  </iframe>
</body>
</html>
